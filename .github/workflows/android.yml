name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # assembleRelease also runs R8 and Android lint's release checks (unsigned here; signed builds
      # come from release.yml).
      - name: Run unit tests and build APKs
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk QuitChallenge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QuitChallenge-apk
          path: QuitChallenge.apk

      # Test build of every push, as a pre-release named "dev-build" (for testers, not the public).
      # Public, signed releases are made by release.yml.
      - name: Publish test APK
        if: github.event_name == 'push' && github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release delete dev-build --yes --cleanup-tag || true
          gh release create dev-build QuitChallenge.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Test build (${GITHUB_REF_NAME})" \
            --notes "Automatic debug build for testing, not for the public. Commit: $GITHUB_SHA"
