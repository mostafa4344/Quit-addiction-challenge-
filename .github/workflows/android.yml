name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk QuitChallenge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: QuitChallenge-apk
          path: QuitChallenge.apk

      # Publishes the newest APK on the Releases page so it can be downloaded straight to a phone.
      - name: Publish latest APK
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest QuitChallenge.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "সর্বশেষ APK (${GITHUB_REF_NAME})" \
            --notes "স্বয়ংক্রিয়ভাবে বানানো টেস্ট APK। কমিট: $GITHUB_SHA"
