name: Release

# Builds the signed public release: an APK for the website and an AAB for Google Play.
# Start it by pushing a version tag (git tag v1.0.0 && git push origin v1.0.0) or from the
# Actions tab. Needs four repository secrets, made by scripts/create-release-key.ps1:
#   QC_KEYSTORE_BASE64, QC_KEYSTORE_PASSWORD, QC_KEY_ALIAS, QC_KEY_PASSWORD
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the signing key is set up
        env:
          KEYSTORE: ${{ secrets.QC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::No signing key. Run scripts/create-release-key.ps1 on your PC first (see docs/release-guide.md)."
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload-key.jks"

      - name: Test and build signed APK + AAB
        env:
          QC_KEYSTORE_FILE: ${{ runner.temp }}/upload-key.jks
          QC_KEYSTORE_PASSWORD: ${{ secrets.QC_KEYSTORE_PASSWORD }}
          QC_KEY_ALIAS: ${{ secrets.QC_KEY_ALIAS }}
          QC_KEY_PASSWORD: ${{ secrets.QC_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease bundleRelease

      - name: Collect files
        id: files
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $VERSION in app/build.gradle.kts"
            exit 1
          fi
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/QuitChallenge.apk
          cp app/build/outputs/bundle/release/app-release.aab "out/QuitChallenge-$VERSION.aab"
          cp app/build/outputs/mapping/release/mapping.txt "out/mapping-$VERSION.txt"
          # Must be signed with the release key, never the debug key.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs out/QuitChallenge.apk | tee out/cert.txt
          if grep -q "CN=Android Debug" out/cert.txt; then echo "::error::APK is debug-signed"; exit 1; fi
          (cd out && sha256sum QuitChallenge.apk > QuitChallenge.apk.sha256)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.files.outputs.tag }}
          VERSION: ${{ steps.files.outputs.version }}
        run: |
          NOTES="docs/release-notes/$VERSION.md"
          [ -f "$NOTES" ] || NOTES=/dev/null
          gh release delete "$TAG" --yes || true
          gh release create "$TAG" \
            out/QuitChallenge.apk out/QuitChallenge.apk.sha256 "out/QuitChallenge-$VERSION.aab" "out/mapping-$VERSION.txt" \
            --target "$GITHUB_SHA" \
            --title "Quit Challenge $VERSION" \
            --notes-file "$NOTES" \
            --latest
